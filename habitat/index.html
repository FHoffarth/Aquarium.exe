<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aquarium WebView2 composition probe</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #031d29; }
  </style>
</head>
<body>
  <canvas id="probe"></canvas>
  <script>
    addEventListener('error', event => {
      window.chrome.webview.postMessage(`habitat-js-error:${event.message}@${event.filename}:${event.lineno}`);
    });
    addEventListener('unhandledrejection', event => {
      window.chrome.webview.postMessage(`habitat-promise-error:${String(event.reason)}`);
    });
  </script>
  <script type="module" src="habitat.js"></script>
</body>
</html>
